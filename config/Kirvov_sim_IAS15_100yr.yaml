simulation:
  name: "Kirvov_sim_1AS15_100yr"
  random_seed: 0
  output_dir: "outputs"

units:
  time: "yr"
  length: "AU"
  mass: "Msun"

integration:
  integrator: "IAS15"
  timestep_fraction_of_planet_period: 0.1
  maxtime: 100.0
  Noutputs: 100
  exit_max_distance: 1000.0

star:
  mass: 1.00

giant_planet:
  mass_jupiter: 0.00011
  a: 1
  e: 3.2e-5
  inc_deg: 3.2e-5
  omega_deg: 100.0
  Omega_random: true

  t_peri_jd: 2450870.0
  orbital_period_days: 1311.0
  epoch_jd: 2451545.0

disk:
  amin: 0.945
  amax: 1.055
  emin: 0.0
  emax: 3.2e-5
  imin_deg: 0.0
  imax_deg: 3.2e-5

dwarf_planets:
  N: 800
  total_mass_earth: 0.28

test_particles:
  N: 0
  distribution: "uniform"

plots:
  dpi: 200

  scale:
    x: "linear"
    y: "linear"

  limits:
    mode: "auto"
    ae:
      xlim: null
      ylim: null

    ai:
      xlim: null
      ylim: null

    e_evolution:
      xlim: null
      ylim: null

    i_evolution:
      xlim: null
      ylim: null

    a_evolution:
      xlim: null
      ylim: null

    survival:
      xlim: null
      ylim: null

  final_conditions:
    output_file: "outputs/FinalConditions.png"
